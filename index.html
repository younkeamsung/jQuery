<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>영화 관리</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            margin-bottom: 30px;
        }

        input {
            padding: 8px;
            margin-right: 5px;
        }

        button {
            padding: 8px 12px;
            margin-left: 5px;
        }

        #movieList {
            margin-top: 30px;
        }

        .movie {
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <h1>영화 관리</h1>

    <h2>영화 추가</h2>

    <input type="text" id="movieTitle" placeholder="영화 제목">

    <input type="number" id="movieYear" placeholder="개봉년도">

    <button id="addMovieBtn">영화 추가</button>


    <h2>영화 수정</h2>

    <input type="hidden" id="editMovieId">

    <input type="text" id="editMovieTitle" placeholder="영화 제목">

    <input type="number" id="editMovieYear" placeholder="개봉년도">

    <button id="updateMovieBtn">영화 수정</button>


    <h2>영화 목록</h2>

    <input type="text" id="searchTitle" placeholder="영화 제목 검색">

    <button id="searchMovieBtn">검색</button>

    <button id="searchResetBtn">전체 보기</button>

    <label for="sortMovies">개봉 연도 정렬:</label>
    <select id="sortMovies">
        <option value="yearAsc">오래된 영화순</option>
        <option value="yearDesc">최신 영화순</option>
        <option value="titleAsc">제목 가나다순</option>
        <option value="titleDesc">제목 역순</option>
    </select>

    <button id="reloadMoviesBtn" type="button">목록 새로고침</button>

    <p id="loadingMessage" style="display: none;">
        처리 중입니다...
    </p>

    <p id="emptyMessage" style="display: none;">
        영화가 없습니다.
    </p>

    <p id="statusMessage" style="display: none;"></p>

    <div id="movieList"></div>

    <div id="pagination">
        <button id="prevPageBtn" type="button">이전</button>
        <span id="pageInfo">1 / 1 페이지</span>
        <button id="nextPageBtn" type="button">다음</button>
    </div>


    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        const API_BASE_URL = "http://localhost:5296/api/movies";
        let statusMessageTimer;

        let currentPage = 1;
        let pageSize = 5;
        let allMovies = [];
        

        function clearStatusMessage(){
            clearTimeout(statusMessageTimer);

            $("#statusMessage")
                .stop(true, true)
                .text("")
                .hide();
        }

        function showStatusMessage(message, isSuccess){
            let $message = $("#statusMessage");
            //이전메시지의 타이머가있으면 취소
            clearTimeout(statusMessageTimer);
            //메시지 표시
            $message
                .stop(true, true)
                .text(message)
                .css("color", isSuccess ? "green" : "red")
                .show();

            statusMessageTimer = setTimeout(function(){
                $message.fadeOut();
            }, 3000);
        }

        function setButtonDisabled(buttonId, disabled) {
            $("#" + buttonId).prop("disabled", disabled);
        }

        function requestAjax(url, method, data, success, error, complete) {
            $("#loadingMessage").show();

            $.ajax({
                url: url,
                method: method,
                contentType: "application/json",
                data: data ? JSON.stringify(data) : null,

                success: function (result) {
                    success(result);
                },

                error: function (xhr) {
                    error(xhr);
                },

                complete: function(){
                    $("#loadingMessage").hide();

                    if(complete){
                        complete();
                    }
                }
            });
        }

        function renderMovie(movie) {
            return (
                "<div class='movie' id='movie-" + movie.id + "'>" +
                movie.title +
                " (" +
                movie.year +
                ") " +
                "<button class='editMovie' data-id='" + movie.id + "'>수정</button>" +
                "<button class='deleteMovie' data-id='" + movie.id + "'>삭제</button>" +
                "</div>"
            );
        }

        function getMovieFormData(titleSelector, yearSelector){
            return{
                title: $(titleSelector).val(),
                year: Number($(yearSelector).val())
            };
        }

        function clearMovieForm(){
            $("#movieTitle").val("");
            $("#movieYear").val("");
        }

        function clearEditMovieForm(){
            $("#editMovieId").val("");
            $("#editMovieTitle").val("");
            $("#editMovieYear").val("");
        }

        function sortMovies(movies, order){
            return movies.slice().sort(function(a, b){
                if(order === "yearDesc"){
                    return b.year - a.year;
                }

                if(order === "titleAsc"){
                    return a.title.localeCompare(b.title, "ko");
                }

                if(order === "titleDesc"){
                    return b.title.localeCompare(a.title, "ko");
                }

                return a.year - b.year;
            });
        }

        function renderMovies(movies) {
            allMovies = movies;

            $("#movieList").empty();
            $("#emptyMessage").hide();
            
            let order = $("#sortMovies").val() || "yearAsc";
            let sortedMovies = sortMovies(allMovies, order);

            let totalPages = Math.max(1, Math.ceil(sortedMovies.length / pageSize));

            if(currentPage > totalPages){
                currentPage = totalPages;
            }

            let startIndex = (currentPage - 1) * pageSize;

            let pageMovies = sortedMovies.slice(startIndex, startIndex + pageSize);

            $("#pageInfo").text(currentPage + " / " + totalPages + " 페이지");

            $("#prevPageBtn").prop("disabled", currentPage === 1);
            $("#nextPageBtn").prop("disabled", currentPage === totalPages);

            if (movies.length === 0) {
                $("#emptyMessage").text("영화가 없습니다.").show();
                return;
            }

            pageMovies.forEach(function (movie) {
                $("#movieList").append(renderMovie(movie));
            });
        }


        function loadMovies(onComplete) {

            requestAjax(
                API_BASE_URL,
                "GET",
                null,

                function (data) {

                    renderMovies(data);

                },

                function (xhr) {

                    alert("영화 목록을 가져오지 못했습니다.");

                },
                function () {
                    if (onComplete) {
                        onComplete();
                    }
                }
            );
        }

        function addMovie(){
            
            if(!validateMovieForm("#movieTitle", "#movieYear")){
                return;
            }

            clearStatusMessage();

            setButtonDisabled("addMovieBtn", true);

            let movie = getMovieFormData("#movieTitle", "#movieYear");

            requestAjax(
                API_BASE_URL,
                "POST",
                movie,

                function(data){
                    clearMovieForm();
                    loadMovies();
                    showStatusMessage("영화가 추가되었습니다.", true);
                    
                },
                function(xhr){
                    handleAjaxError(xhr, "영화 추가에 실패했습니다.");
                },
                function(){
                    setButtonDisabled("addMovieBtn", false);
                }

            );
        }

        function deleteMovie(movieId){

            requestAjax(
                API_BASE_URL + "/" + movieId,
                "DELETE",
                null,

                function () {
                    loadMovies();
                    showStatusMessage("영화가 삭제되었습니다.", true);
                },

                function (xhr) {

                    handleAjaxError(xhr, "영화 삭제에 실패했습니다.");

                }
            );
        }

        function getMovie(movieId){

            requestAjax(
                API_BASE_URL + "/" + movieId,
                "GET",
                null,

                function (data) {
                    editMovie(data);
                },

                function (xhr) {

                    handleAjaxError(xhr, "영화정보를 가져오지 못했습니다.");

                }
                
            );
        }

        function editMovie(movie){
            $("#editMovieId").val(movie.id);
            $("#editMovieTitle").val(movie.title);
            $("#editMovieYear").val(movie.year);
        }

        function updateMovie(){

            let movieId = $("#editMovieId").val();

            if(!validateMovieForm("#editMovieTitle", "#editMovieYear")){
                return;
            }

            clearStatusMessage();
            setButtonDisabled("updateMovieBtn", true);

            let movie = getMovieFormData(
                "#editMovieTitle",
                "#editMovieYear"
            );

            requestAjax(
                API_BASE_URL + "/" + movieId,
                "PUT",
                movie,

                function (data) {
                    clearEditMovieForm();
                    loadMovies();
                    showStatusMessage("영화가 수정되었습니다.", true);
                },

                function (xhr) {
                    handleAjaxError(xhr, "영화 수정에 실패했습니다.");
                },
                function(){
                    setButtonDisabled("updateMovieBtn", false);
                }
            );
        }

        function handleAjaxError(xhr, defaultMessage){
            if(xhr.status === 400){
                
                let message = xhr.responseJSON?.message;

                showStatusMessage(message || "입력값을 확인해주세요.", false);
                return;
            }

            if(xhr.status === 404){

                showStatusMessage("요청한 데이터를  찾을 수 없습니다.", false);
                return;
            }

            showStatusMessage(defaultMessage, false);
        }

        function validateMovieForm(titleSelector, yearSelector){
            let title = $(titleSelector).val().trim();
            let year = Number($(yearSelector).val());

            if(title === ""){
                alert("영화 제목을 입력해주세요.");
                return false;
            }

            if(year === null || year < 1900 || year > 2100){
                alert("개봉년도는 1900년부터 2100년까지 정수로 입력해주세요.");
                return false;
            }

            return true;
        }
        
        loadMovies();

        // 영화 추가
        $("#addMovieBtn").click(function () {

            addMovie();
            
        });


        // 수정 버튼
        $(document).on("click", ".editMovie", function () {

            let movieId = $(this).data("id");

            getMovie(movieId);
        });


        // 영화 수정
        $("#updateMovieBtn").click(function () {

            updateMovie();

        });


        // 영화 삭제
        $(document).on("click", ".deleteMovie", function () {

            let movieId = $(this).data("id");

            deleteMovie(movieId);
            
        });

        //영화검색
        $("#searchMovieBtn").click(function(){
            let title = $("#searchTitle").val().trim();

            requestAjax(
                API_BASE_URL + "/search?title=" + encodeURIComponent(title),
                "GET",
                null,

                function(data){
                    currentPage = 1;
                    renderMovies(data);
                    if (data.length === 0) {
                        $("#emptyMessage").text("검색 결과가 없습니다.");
                    }
                },

                function(xhr){
                    handleAjaxError(xhr, "영화 검색에 실패했습니다.");
                }
            );
        });

        //영화검색 리셋
        $("#searchResetBtn").click(function () {

            $("#searchTitle").val("");

            loadMovies();
        });

        // 연도별로 재정렬
        $("#sortMovies").change(function () {
            currentPage = 1;
            renderMovies(allMovies);
        });

        $("#reloadMoviesBtn").click(function () {
            let $button = $(this);
            let originalText = $button.text();

            setButtonDisabled("reloadMoviesBtn", true);
            $button.text("불러오는 중...")

            loadMovies(function(){
                setButtonDisabled("reloadMoviesBtn", false);
                $button.text(originalText);
            });
        });

        $("#prevPageBtn").click(function(){
            if(currentPage > 1){
                currentPage--;
                renderMovies(allMovies);
            }
        });

        $("#nextPageBtn").click(function(){
            let totalPages = Math.max(1, Math.ceil(allMovies.length / pageSize));

            if(currentPage < totalPages){
                currentPage++;
                renderMovies(allMovies);
            }
        })
    </script>

</body>
</html>
